version: '3.8'

# Shared by the API service and the refresh worker: same image, same
# upstream credentials, same mounts — only the command differs.
x-backend-environment: &backend-environment
  - ACCESS_TOKEN=${ACCESS_TOKEN}
  - JIRA_API_TOKEN=${JIRA_API_TOKEN}
  - JIRA_API_HOSTNAME=${JIRA_API_HOSTNAME}
  - ZEPHYR_API_TOKEN=${ZEPHYR_API_TOKEN}
  - EXTERNAL_INSTANCE_URL=${EXTERNAL_INSTANCE_URL}
  - RUBIN_SIM_DATA_DIR=/home/saluser/develop/rubin_sim_data # Rubin SIM data
  - LSST_DISABLE_BUCKET_VALIDATION=${LSST_DISABLE_BUCKET_VALIDATION}
  - REDIS_HOST=redis
  - REDIS_PORT=6379
  - ND_CACHING_DISABLE_REDIS=${ND_CACHING_DISABLE_REDIS:-}

x-backend-volumes: &backend-volumes
  - ${BACKEND_PATH}:/home/saluser/develop
  - ${LOCAL_RUBIN_SIM_DATA_DIR}:/home/saluser/develop/rubin_sim_data:ro # Mount Rubin SIM data directory as read-only
  - ~/.aws:/home/saluser/.aws:ro

services:
  frontend:
    container_name: nightlydigest-frontend
    build:
      context: ${FRONTEND_PATH}
      dockerfile: docker/Dockerfile
    image: nightlydigest-frontend-local
    ports:
      - "5173:5173"
    volumes:
      - ${FRONTEND_PATH}:/usr/src/app
      - /usr/src/app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  backend:
    container_name: nightlydigest-backend
    build:
      context: ${BACKEND_PATH}
      dockerfile: docker/Dockerfile
    image: nightlydigest-backend-local
    environment: *backend-environment
    ports:
      - "8080:8080"
    volumes: *backend-volumes
    depends_on:
      redis:
        condition: service_healthy

  # Keeps today's cache entries warm. Runs as a single container: the
  # worker does no cross-instance coordination, so a second replica
  # would only duplicate upstream fetches.
  refresh-worker:
    container_name: nightlydigest-refresh-worker
    build:
      context: ${BACKEND_PATH}
      dockerfile: docker/Dockerfile
    image: nightlydigest-backend-local
    command: docker/refresh_worker.sh
    environment: *backend-environment
    volumes: *backend-volumes
    depends_on:
      redis:
        condition: service_healthy

  redis:
    container_name: nightlydigest-redis
    image: redis:7-alpine
    # Cache, not a datastore: bounded memory with LRU eviction and no
    # persistence.
    command: >
      redis-server
      --maxmemory ${REDIS_MAX_MEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    # Published so redis-cli and scripts/perf_test.py can reach the
    # cache from the host.
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  nginx:
    container_name: nightlydigest-nginx
    image: nginx:latest
    ports:
      - "80:80"
    environment:
      - ND_CACHING_DISABLE_NGINX=${ND_CACHING_DISABLE_NGINX:-}
    depends_on:
      frontend:
        condition: service_healthy
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template
