proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=1d use_temp_path=off;

log_format main_cache '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" $upstream_cache_status';
access_log /var/log/nginx/access.log main_cache;

server {
  listen 80;
  server_name localhost;

  location /nightlydigest {
    proxy_pass http://frontend:5173;
  }

  location /nightlydigest/api/ {
    proxy_cache api_cache;
    proxy_cache_use_stale error timeout updating;
    proxy_cache_lock on;
    add_header X-Cache-Status $upstream_cache_status;

    proxy_read_timeout 600s;
    proxy_pass http://backend:8080/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
